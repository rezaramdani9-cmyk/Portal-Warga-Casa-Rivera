<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Warga</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#2a5c96;--dk:#17406f;--tl:#1a8f8a;--gr:#8dc63f;--bg:#eef5f6;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:#2b2f33;background:#fff;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 12px #0002;border-top:5px solid #333}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:21px;color:var(--dk)}
nav a{font-size:12px;font-weight:700;color:#555;text-decoration:none;margin-left:14px;cursor:pointer}nav a:hover{color:var(--tl)}
.hero{background:linear-gradient(135deg,var(--dk),var(--tl));color:#fff;text-align:center;padding:44px 16px}.hero h1{margin:0 0 6px;font-weight:700;font-size:30px}
section{padding:34px 16px}section:nth-of-type(even){background:var(--bg)}section>div{max-width:1100px;margin:auto}
h2{text-align:center;color:var(--bl);font-weight:700;font-size:24px;margin:0 0 18px}
.tx{text-align:center;max-width:820px;margin:auto;line-height:1.7}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}.gal figure{margin:0;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0002}.gal img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}.gal figcaption{font-size:12px;padding:8px}
.btn{display:inline-block;background:var(--tl);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:700 12px Montserrat,Arial;text-decoration:none;cursor:pointer;margin:3px 3px 3px 0}.btn.red{background:var(--rd)}.btn.gr{background:#777}.btn.sm{padding:5px 9px;font-size:11px}
input,select,textarea{font:13px Montserrat,Arial;padding:8px;border:1px solid #bbb;border-radius:6px;margin:3px 0;max-width:100%;width:100%}
.add{background:#fff;border:1px dashed #9bb;border-radius:10px;padding:12px;margin:14px auto 0;max-width:560px}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{background:var(--dk);color:#fff;text-align:left}th,td{padding:8px;border-bottom:1px solid #e3e3e3;vertical-align:top}td.r{text-align:right}.sc{overflow-x:auto;border-radius:8px}
footer{background:var(--dk);color:#cde;text-align:center;font-size:12px;padding:18px}
/* aplikasi */
#app{display:none;min-height:100vh;background:#f3f6f8}
aside{width:236px;flex:none;background:var(--dk);color:#dbe8f5;padding:16px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.bn{font-weight:800;font-size:16px;color:#fff;padding:4px 8px 14px;line-height:1.3}.bn small{display:block;font-weight:400;font-size:11px;color:#9fc0e0;margin-top:4px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px}aside button:hover{background:#ffffff18}aside button.on{background:#fff;color:var(--dk)}aside button:focus-visible,.btn:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
aside hr{border:0;border-top:1px solid #ffffff2a;width:100%;margin:8px 0}
main{flex:1;padding:24px;min-width:0;max-width:1000px}main h1{margin:0 0 16px;font-size:22px;color:var(--dk)}main h3{color:var(--dk);margin:22px 0 8px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.k{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0001}.k small{color:#667}.k b{display:block;font-size:19px;margin-top:4px;color:var(--dk)}.k.g b{color:#15803d}.k.m b{color:var(--rd)}
.pnl{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0001;margin-bottom:12px}.pnl p{margin:4px 0 0;line-height:1.6;white-space:pre-wrap}
.bars{display:flex;gap:14px;align-items:flex-end;height:130px;padding-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:#667;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:inline-block;width:42%;min-height:2px;background:var(--tl);border-radius:3px 3px 0 0}.bars i+i{background:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row select,.row input{width:auto}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e7f6e7;color:#15803d}.tag.n{background:#fdeaea;color:var(--rd)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}#md>div{background:#fff;border-radius:12px;padding:22px;width:min(400px,92vw);max-height:90vh;overflow:auto}#md h3{margin:0 0 10px;color:var(--dk)}#md label{font-size:12px;font-weight:600;display:block;margin-top:8px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}
@media(max-width:760px){#app{flex-direction:column!important}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center}.bn{display:none}aside button{white-space:nowrap}aside hr{display:none}main{padding:14px}}
</style></head><body>
<div id="pubw"><header><div class="nav"><div class="brand" id="brand">Portal Warga</div><nav id="nv"></nav></div></header>
<div class="hero" id="hero"><h1 id="hn">Portal Warga</h1><div>Informasi dan layanan warga</div></div><div id="pub"></div>
<footer id="ft"></footer></div>
<div id="app"></div><div id="msg"></div><div id="md"><div id="mb"></div></div>
<script>
const $=i=>document.getElementById(i),enc=new TextEncoder(),dec=new TextDecoder();
const ROLES={admin:'Administrator',bendahara:'Bendahara',warga:'Warga'};
const SEC=[['tentang','Tentang Kami'],['tata','Tata Kelola'],['media','Ruang Media'],['produk','Produk & Kemitraan'],['lapor','Pelaporan'],['kontak','Kontak Kami']];
const MN=[['home','Beranda','*'],['umum','Pengumuman','*'],['keu','Keuangan','*'],['warga','Data warga','*'],['iuran','Iuran','f'],['link','CCTV & Sheet','*'],['log','Riwayat','f'],['web','Kelola website','a'],['user','Pengguna','a'],['set','Pengaturan','a']];
const KAT=['Iuran','Keamanan','Kebersihan','Perbaikan','Kegiatan','Lain-lain'];
/* HAPUS RIWAYAT MANUAL: isi RESET_LOG dengan teks bebas apa saja (misal 'hapus1'), unggah index.html, lalu login sebagai Administrator sekali. Riwayat dibersihkan dan tercatat. Untuk menghapus lagi nanti, ganti teksnya (misal 'hapus2'). Biarkan '' kalau tidak mau menghapus. */
const RESET_LOG='';
let V=null,P={},S=null,D=null,tab='home',site=false,fb='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u)?u:'#',rp=n=>'Rp '+new Intl.NumberFormat('id-ID').format(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const adm=()=>S&&S.role==='admin',fin=()=>S&&S.role!=='warga',can=f=>f==='*'||(f==='a'&&adm())||(f==='f'&&fin())||(f==='w'&&S&&S.role==='warga'&&!!S.rumah);
const bln=()=>new Date().toISOString().slice(0,7),bl=k=>new Date(k+'-15').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',3500)}
const b64e=u=>{let s='';for(const b of u)s+=String.fromCharCode(b);return btoa(s)},b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64s=s=>btoa(unescape(encodeURIComponent(s)));
const im=r=>crypto.subtle.importKey('raw',b64d(r),'AES-GCM',true,['encrypt','decrypt']),rnd=()=>b64e(crypto.getRandomValues(new Uint8Array(32)));
async function kek(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64e(iv),ct:b64e(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(o)))))}}
async function unseal(k,o){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.ct))))}
async function mkUser(u,role,pw,kRaw,ktRaw,rm){const salt=crypto.getRandomValues(new Uint8Array(16));V.users[u]={role,rm:rm||undefined,salt:b64e(salt),...await seal(await kek(pw,salt),{k:kRaw,kt:role==='warga'?null:ktRaw,rumah:rm||undefined})}}
async function ghPut(path,content,m){const br=V.branch||'main',H={Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json'},u=`https://api.github.com/repos/${V.repo}/contents/${path}`;let r;
 try{for(let i=0;i<3;i++){const g=await fetch(u+'?ref='+br+'&_='+Date.now(),{headers:H,cache:'no-store'});const sha=g.ok?(await g.json()).sha:undefined;
 r=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:m,content,branch:br,sha})});if(r.status!==409)break;await new Promise(z=>setTimeout(z,1000))}}catch(e){throw new Error('Tidak bisa terhubung ke GitHub. Cek internet, matikan VPN/adblock, lalu coba lagi')}
 if(!r.ok){const E={401:'Token salah atau sudah kedaluwarsa',403:'Token tidak punya izin Contents: Read and write',404:'Repo tidak ditemukan atau token tidak punya akses ke repo itu. Cek penulisan pemilik/nama-repo',409:'Data di GitHub baru saja berubah. Tunggu sebentar lalu coba simpan lagi',422:'Branch tidak ditemukan. Cek nama branch (biasanya main)'};let d='';try{d=(await r.json()).message}catch(e){}throw new Error(E[r.status]||d||r.status)}}
async function saveVault(){try{if(!fin())throw new Error('Peran Warga hanya bisa melihat');V.data=await seal(S.K,D);await ghPut('data/vault.json',b64s(JSON.stringify(V)),'Update data');render();msg('Tersimpan');return true}catch(e){msg('Gagal simpan: '+e.message);return false}}
async function savePub(){try{await ghPut('data/public.json',b64s(JSON.stringify(P,null,2)),'Update konten');render();msg('Tersimpan')}catch(e){msg('Gagal simpan: '+e.message)}}
async function init(){try{P=await (await fetch('data/public.json?'+Date.now())).json()}catch(e){P={}}
 try{const r=await fetch('data/vault.json?'+Date.now());V=r.ok?await r.json():null}catch(e){V=null}render()}
const bulanList=(a,b)=>{const o=[];let[y,m]=a.split('-').map(Number);const[y2,m2]=b.split('-').map(Number);while((y<y2||(y===y2&&m<=m2))&&o.length<240){o.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}return o};
const geser=(k,n)=>new Date(+k.slice(0,4),+k.slice(5)-1+n,15).toISOString().slice(0,7),tg=r=>bulanList(r.mulai||bln(),bln()).filter(k=>!(r.lunas&&r.lunas[k]));
function fixD(){D.links=D.links||[];D.pengumuman=D.pengumuman||[];D.keuangan=D.keuangan||{entries:[],history:[]};D.warga=D.warga||[];if(!D.rumah){D.rumah=[];if(D.warga.some(w=>w.blok!==undefined&&!w.rumah)){const o=D.warga;D.warga=[];o.forEach(w=>{D.rumah.push({id:w.id,blok:w.blok||'-',kk:w.nama,iuran:w.iuran||0,mulai:bln(),lunas:w.lunas||{}});D.warga.push({id:uid(),rumah:w.id,nama:w.nama,hub:'Kepala Keluarga',jk:'',ttl:'',hp:w.hp||'',ket:''})})}}}
function myIuran(ks){if(S.role!=='warga')return'';const r=D.rumah.find(x=>x.id===S.rumah);if(!r)return`<div class="pnl" style="border-left:5px solid #b45309"><b>Akun belum dihubungkan ke rumah</b><p>Hubungi Administrator agar status iuran rumah Anda tampil di sini.</p></div>`;
 const t=tg(r),bk=bln(),ok=!!(r.lunas&&r.lunas[bk]),c=t.length?'#c0392b':'#15803d',h=ok?'Sudah lunas':t.includes(bk)?'Belum lunas':'Belum ada tagihan';
 return`<div style="background:${c};color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px"><div style="font-size:12px;opacity:.9">Iuran rumah ${esc(r.blok)} · ${bl(bk)}</div><div style="font-size:26px;font-weight:800;margin:4px 0">${h}</div><div style="font-size:13px;line-height:1.6">${t.length?`Tunggakan ${t.length} bulan: ${t.map(bl).join(', ')}. Total ${rp(t.length*(r.iuran||0))}. Silakan hubungi Bendahara untuk pembayaran.`:(r.mulai||'')>bk?`Iuran mulai berlaku ${bl(r.mulai)}.`:'Terima kasih, tidak ada tunggakan.'}</div></div><div class="pnl"><b>Riwayat iuran 6 bulan terakhir</b><div style="margin-top:8px;line-height:2">${ks.map(k=>`<span class="tag ${r.lunas&&r.lunas[k]?'':'n'}">${bl(k)}: ${r.lunas&&r.lunas[k]?'lunas':'belum'}</span> `).join('')}</div><small style="color:#667">Iuran ${rp(r.iuran||0)} per bulan. Pembayaran dicatat oleh Bendahara.</small></div>`}
function notif(){try{const r=D.rumah.find(x=>x.id===S.rumah);if(!r)return;const t=tg(r);msg(t.length?`Iuran rumah ${r.blok} belum lunas: ${t.length} bulan (${rp(t.length*(r.iuran||0))})`:`Iuran ${bl(bln())} sudah lunas. Terima kasih`)}catch(e){}}
function hist(a,d){D.keuangan.history.push({w:new Date().toLocaleString('id-ID'),o:ROLES[S.role]+' ('+S.user+')',a,d})}
function modal(h){$('mb').innerHTML=h;$('md').style.display='flex'}window.closeM=()=>$('md').style.display='none';
function fm(t,fs,ok,v={},btn='Simpan'){modal(`<h3>${t}</h3>`+fs.map(([id,l,ty,o])=>`<label for="f_${id}">${l}</label>`+(ty==='select'?`<select id="f_${id}">${o.map(x=>`<option ${v[id]==x?'selected':''}>${x}</option>`).join('')}</select>`:ty==='area'?`<textarea id="f_${id}" rows="5">${esc(v[id])}</textarea>`:`<input id="f_${id}" type="${ty}" value="${esc(v[id]??'')}">`)).join('')+`<div style="margin-top:12px"><button class="btn" id="fok">${btn}</button><button class="btn gr" onclick="closeM()">Batal</button></div>`);
 $('fok').onclick=async()=>{const r={};fs.forEach(f=>r[f[0]]=$('f_'+f[0]).value.trim());if(await ok(r)!==false)closeM()}}
/* ===== halaman publik ===== */
const okp=p=>/^images\/[\w.-]+$/.test(p||''),logoImg=h=>okp(P.logo)?`<img src="${esc(P.logo)}" alt="" style="height:${h}px;vertical-align:middle;margin-right:10px">`:'';
const TEMA={'Biru-hijau (bawaan)':['#17406f','#1a8f8a','#2a5c96'],'Hijau':['#14532d','#16a34a','#15803d'],'Marun':['#7f1d1d','#b45309','#9a3412'],'Ungu':['#4c1d95','#7c3aed','#6d28d9'],'Hitam-emas':['#1f2937','#b8860b','#374151']};
function theme(){const t=TEMA[P.tema]||TEMA['Biru-hijau (bawaan)'],r=document.documentElement.style;r.setProperty('--dk',t[0]);r.setProperty('--tl',t[1]);r.setProperty('--bl',t[2]);$('hero').style.background=okp(P.hero)?`linear-gradient(${t[0]}d0,${t[1]}b0),url("${P.hero}") center/cover`:`linear-gradient(135deg,${t[0]},${t[1]})`}
function render(){const nm=P.nama||'Portal Warga',inApp=S&&!site;document.title=nm;$('hn').textContent=nm;$('brand').innerHTML=logoImg(40)+esc(nm);theme();$('ft').textContent='© '+nm;
 $('pubw').style.display=inApp?'none':'';$('app').style.display=inApp?'flex':'none';
 $('nv').innerHTML=SEC.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('')+(S?`<a onclick="site=false;tab='home';render();scrollTo(0,0)">Buka aplikasi</a><a onclick="logout()">Keluar</a>`:`<a onclick="loginUI()">Masuk</a>`);
 $('pub').innerHTML=SEC.map(([k,a])=>{const x=P[k]||{};return`<section id="${k}"><div><h2>${a}</h2><p class="tx">${esc(x.teks).replace(/\n/g,'<br>')}</p>${k==='media'?`<div class="gal">${(x.gambar||[]).map(g=>`<figure><img loading="lazy" src="${esc(g.src)}" alt="${esc(g.cap)}" onclick="window.open(this.src)"><figcaption>${esc(g.cap)}</figcaption></figure>`).join('')}</div>`:''}${k==='lapor'?laporForm():''}</div></section>`}).join('');
 if(inApp)$('app').innerHTML=appHTML()}
function laporForm(){return`<div class="add"><input id="rn" placeholder="Nama pelapor"><input id="rb" placeholder="Blok / nomor rumah"><select id="rk"><option>Fasilitas umum</option><option>Keamanan</option><option>Kebersihan</option><option>Lainnya</option></select><textarea id="rt" rows="4" placeholder="Uraian laporan"></textarea><button class="btn" onclick="kirimLap()">Kirim lewat WhatsApp</button><div style="font-size:11px;color:#777">Laporan terkirim setelah Anda menekan kirim di WhatsApp.</div></div>`}
window.kirimLap=()=>{if(!P.wa)return msg('Nomor WhatsApp belum diatur');if(!$('rn').value||!$('rt').value)return msg('Isi nama dan uraian laporan');const d=new Date(),no='LP-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(100+Math.random()*900);window.open('https://wa.me/'+P.wa+'?text='+encodeURIComponent(`*LAPORAN WARGA*\nNo: ${no}\nTanggal: ${d.toLocaleDateString('id-ID')}\nNama: ${$('rn').value}\nBlok/Rumah: ${$('rb').value||'-'}\nKategori: ${$('rk').value}\n\n${$('rt').value}`),'_blank')};
/* ===== kerangka aplikasi ===== */
function appHTML(){if(V.init&&tab!=='set')tab='set';const m=MN.filter(x=>can(x[2]));const cur=m.find(x=>x[0]===tab)||m[0];tab=cur[0];
 const v={home,umum,keu,keluarga,warga,iuran,link,log,web,user,set:setH}[tab]();
 return`<aside><div class="bn">${okp(P.logo)?`<img src="${esc(P.logo)}" alt="" style="height:46px;background:#fff;border-radius:8px;padding:4px;display:block;margin-bottom:8px">`:''}${esc(P.nama||'Portal Warga')}<small>${ROLES[S.role]} · ${esc(S.user)} · v15</small></div>${m.map(x=>`<button class="${x[0]===tab?'on':''}" ${V.init&&x[0]!==tab?'style="opacity:.4" title="Terkunci sampai aktivasi selesai" onclick="msg(\'Selesaikan aktivasi di Pengaturan dulu\')"':`onclick="tab='${x[0]}';render();scrollTo(0,0)"`}>${x[1]}</button>`).join('')}<hr><button onclick="site=true;render();scrollTo(0,0)">Lihat situs publik</button><button onclick="logout()">Keluar</button></aside><main><h1>${cur[1]}</h1>${V.init?'<div class="pnl" style="border-left:4px solid var(--rd)"><b>Aktivasi belum selesai.</b><p>Menu lain terkunci. Isi token GitHub dan password Administrator baru di bawah, lalu klik Simpan. Setelah itu semua menu terbuka.</p></div>':""}${v}</main>`}
function sums(){const E=D.keuangan.entries,m=E.filter(e=>e.jenis==='Masuk').reduce((a,e)=>a+e.jumlah,0),k=E.filter(e=>e.jenis==='Keluar').reduce((a,e)=>a+e.jumlah,0);return{m,k,s:m-k}}
function home(){const{m,k,s}=sums(),E=D.keuangan.entries,now=new Date(),ks=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,15);ks.push(d.toISOString().slice(0,7))}
 const t=(key,j)=>E.filter(e=>e.tanggal.slice(0,7)===key&&e.jenis===j).reduce((a,e)=>a+e.jumlah,0),mx=Math.max(1,...ks.map(x=>Math.max(t(x,'Masuk'),t(x,'Keluar'))));
 const W=D.rumah,bk=bln(),lun=W.filter(w=>w.lunas&&w.lunas[bk]).length;
 return`${myIuran(ks)}<div class="cards"><div class="k g"><small>Pemasukan</small><b>${rp(m)}</b></div><div class="k m"><small>Pengeluaran</small><b>${rp(k)}</b></div><div class="k"><small>Saldo kas</small><b>${rp(s)}</b></div>${fin()?`<div class="k"><small>Iuran ${bl(bk)}</small><b>${lun} dari ${W.length} rumah lunas</b></div>`:''}</div>
 <h3>Arus kas 6 bulan terakhir</h3><div class="pnl"><div class="bars">${ks.map(x=>`<div><span><i style="height:${t(x,'Masuk')/mx*90}px" title="Masuk"></i><i style="height:${t(x,'Keluar')/mx*90}px" title="Keluar"></i></span>${x.slice(5)}/${x.slice(2,4)}</div>`).join('')}</div><small style="color:#667">Hijau-biru: pemasukan, merah: pengeluaran</small></div>

window.delUser=async u=>{if(!confirm('Hapus pengguna '+u+'?'))return;delete V.users[u];hist('Hapus pengguna',u);await saveVault()};
const guess=()=>{const h=location.hostname;return h.endsWith('.github.io')?h.split('.')[0]+'/'+(location.pathname.split('/')[1]||h):''};
function setH(){return`<div class="pnl" style="max-width:560px"><b>Penyimpanan GitHub</b><p style="font-size:12px;color:#667;margin:4px 0">Repo terisi otomatis dari alamat web. Cukup isi token dan password baru. Nomor WhatsApp diatur di menu Kelola website.</p><input id="sr2" value="${esc(V.repo||guess())}" placeholder="pemilik/nama-repo"><input id="sb2" value="${esc(V.branch)}"><input id="st2" type="password" placeholder="Token GitHub (kosongkan jika tidak diganti)">${V.init?'<br><b>Aktivasi pertama:</b> ganti password Administrator (wajib).<input id="sn" type="password" placeholder="Password Administrator baru (min. 10)">':'<br><b>Ganti password saya</b><input id="sn" type="password" placeholder="Password baru (kosongkan jika tidak diganti)">'}<button class="btn" onclick="saveSet()">Simpan</button>${V.init?'':recBox()}</div>`}
window.saveSet=async()=>{V.repo=$('sr2').value.trim();V.branch=$('sb2').value.trim()||'main';const t=$('st2').value.trim(),pw=$('sn').value;
 if(!/^[\w.-]+\/[\w.-]+$/.test(V.repo))return msg('Isi repo dengan format pemilik/nama-repo, contoh: budi/portal-warga');
 const bk=V.init?{V:structuredClone(V),S:{...S}}:null;
 if(V.init){if(!V.repo||!t||pw.length<10)return msg('Isi repo, token, dan password baru (min. 10 karakter)');const kRaw=rnd(),ktRaw=rnd(),kt=await im(ktRaw);S.token=t;S.kRaw=kRaw;S.ktRaw=ktRaw;S.kt=kt;S.K=await im(kRaw);V.tok=await seal(kt,{t});V.users={};await mkUser(S.user,'admin',pw,kRaw,ktRaw);delete V.init;tab='home';RC=await mkRec(kRaw,ktRaw)}
 else{if(t){S.token=t;V.tok=await seal(S.kt,{t})}if(pw){if(pw.length<10)return msg('Password minimal 10 karakter');await mkUser(S.user,'admin',pw,S.kRaw,S.ktRaw)}}
 hist('Pengaturan','Diperbarui');if(!await saveVault()){if(bk){V=bk.V;S=bk.S;tab='set'}RC=null}else if(RC){showRec(RC);RC=null}};
/* ===== masuk / keluar ===== */
const ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',genRec=()=>[...crypto.getRandomValues(new Uint8Array(25))].map(x=>ALF[x%32]).join('').match(/.{5}/g).join('-'),normRec=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/(.{5})(?=.)/g,'$1-');let RC=null;
async function mkRec(kRaw,ktRaw){const c=genRec(),salt=crypto.getRandomValues(new Uint8Array(16));V.rec={salt:b64e(salt),...await seal(await kek(c,salt),{k:kRaw,kt:ktRaw})};return c}
function showRec(c){modal(`<h3>Kode pemulihan</h3><p style="font-size:12px;line-height:1.6">Tulis kode ini di kertas atau simpan di password manager. Kode ini hanya tampil sekali dan dipakai kalau Anda lupa password Administrator. Siapa pun yang memegang kode ini bisa membuka semua data, jadi jangan dibagikan.</p><div class="pnl" style="font-size:17px;font-weight:800;text-align:center;user-select:all">${c}</div><button class="btn" onclick="closeM()">Sudah saya simpan</button>`)}
const recBox=()=>`<hr style="border:0;border-top:1px solid #ddd;margin:14px 0"><b>Kode pemulihan</b><p style="font-size:12px;color:#667;margin:4px 0">${V.rec?'Sudah dibuat.':'Belum dibuat.'} Dipakai lewat tombol "Lupa password" di halaman Masuk. Membuat kode baru membuat kode lama tidak berlaku.</p><button class="btn gr" onclick="newRec()">Buat kode pemulihan baru</button>`;
window.newRec=async()=>{if(!confirm('Buat kode pemulihan baru? Kode lama tidak berlaku lagi.'))return;const old=V.rec,c=await mkRec(S.kRaw,S.ktRaw);hist('Pengaturan','Kode pemulihan dibuat');if(await saveVault())showRec(c);else V.rec=old};
window.lupaUI=()=>V&&V.rec?modal(`<h3>Lupa password</h3><p style="font-size:12px;color:#666">Khusus akun Administrator. Isi kode pemulihan yang Anda simpan.</p><input id="lu" placeholder="Username Administrator"><input id="lc" placeholder="Kode pemulihan (XXXXX-XXXXX-…)"><input id="lp" type="password" placeholder="Password baru (min. 10)"><button class="btn" onclick="doLupa()">Ganti password</button><button class="btn gr" onclick="closeM()">Batal</button>`):modal(`<h3>Lupa password</h3><p style="font-size:13px;line-height:1.6">Kode pemulihan belum pernah dibuat, jadi password tidak bisa dipulihkan. Jika belum ada data penting, kembalikan file data/vault.json ke versi awal lalu aktivasi ulang. Jika ada akun Administrator lain, minta ia mereset lewat menu Pengguna.</p><button class="btn gr" onclick="closeM()">Tutup</button>`);
window.doLupa=async()=>{const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(!V.users[u]||V.users[u].role!=='admin')return msg('Hanya akun Administrator yang bisa dipulihkan');if(p.length<10)return msg('Password minimal 10 karakter');
 try{const b=await unseal(await kek(normRec($('lc').value),b64d(V.rec.salt)),V.rec),kt=await im(b.kt),K=await im(b.k),token=(await unseal(kt,V.tok)).t;D=await unseal(K,V.data);fixD();S={user:u,role:'admin',token,kRaw:b.k,ktRaw:b.kt,kt,K}}catch(e){S=null;D=null;return msg('Kode pemulihan salah')}
 const old=V.users[u];await mkUser(u,'admin',p,S.kRaw,S.ktRaw);hist('Reset password','Lewat kode pemulihan');if(await saveVault()){tab='home';site=false;closeM();msg('Password diganti, Anda sudah masuk')}else{V.users[u]=old;S=null;D=null}};
window.loginUI=()=>V&&V.users?modal(`<h3>Masuk</h3><input id="lgu" placeholder="Username" autocomplete="username"><input id="lgp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">Masuk</button><button class="btn gr" onclick="lupaUI()">Lupa password</button><button class="btn gr" onclick="closeM()">Batal</button>`):modal(`<h3>Masuk</h3><p>Data login tidak ditemukan. Pastikan folder data/ (vault.json) sudah terunggah ke GitHub.</p><button class="btn gr" onclick="closeM()">Tutup</button>`);
window.setupUI=()=>modal(`<h3>Pengaturan awal</h3><p style="font-size:12px;color:#666">Buat penyimpanan terenkripsi di GitHub.</p><input id="sr" placeholder="pemilik/nama-repo"><input id="sb" value="main"><input id="st" type="password" placeholder="Token GitHub (Contents: read/write)"><input id="su" placeholder="Username Administrator"><input id="sp" type="password" placeholder="Password Administrator (min. 10)"><button class="btn" onclick="doSetup()">Buat</button><button class="btn gr" onclick="closeM()">Batal</button>`);
window.doLogin=async()=>{const u=$('lgu').value.trim().toLowerCase(),w=V.users[u];try{if(!w)throw 0;const b=await unseal(await kek($('lgp').value,b64d(w.salt)),w),K=await im(b.k);let kt=null,token=null;if(b.kt){kt=await im(b.kt);token=(await unseal(kt,V.tok)).t}D=await unseal(K,V.data);fixD();S={user:u,role:w.role,token,kRaw:b.k,ktRaw:b.kt,kt,K,rumah:b.rumah};if(S.role==='admin'&&!V.init&&RESET_LOG&&D.keuangan.resetTag!==RESET_LOG){D.keuangan.history=[];D.keuangan.resetTag=RESET_LOG;hist('Riwayat','Dibersihkan lewat pembaruan sistem');await saveVault()}tab=V.init?'set':'home';site=false;closeM();render();scrollTo(0,0);if(S.rumah)notif()}catch(e){msg('Username atau password salah')}};
window.doSetup=async()=>{const u=$('su').value.trim().toLowerCase(),p=$('sp').value,t=$('st').value.trim(),r=$('sr').value.trim();if(!/^[a-z0-9._-]{3,20}$/.test(u)||p.length<10)return msg('Username 3-20 karakter, password minimal 10');if(!t||!r)return msg('Repo dan token wajib');
 try{const kRaw=rnd(),ktRaw=rnd(),kt=await im(ktRaw);V={repo:r,branch:$('sb').value.trim()||'main',users:{},tok:await seal(kt,{t}),data:null};await mkUser(u,'admin',p,kRaw,ktRaw);D={links:[],pengumuman:[],warga:[],rumah:[],keuangan:{entries:[],history:[]}};S={user:u,role:'admin',token:t,kRaw,ktRaw,kt,K:await im(kRaw)};tab='home';site=false;closeM();await saveVault()}catch(e){V=null;S=null;msg('Gagal: '+e.message)}};
window.logout=()=>{S=null;D=null;site=false;render();scrollTo(0,0)};
init().then(()=>{if(location.hash==='#setup'&&(!V||!V.users))setupUI()});
</script></body></html>
