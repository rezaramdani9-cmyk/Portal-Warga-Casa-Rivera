<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Warga</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#2a5c96;--dk:#17406f;--tl:#1a8f8a;--gr:#8dc63f;--bg:#eef5f6;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:#2b2f33;background:#fff;font-size:14px}
header{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 12px #0002;border-top:5px solid #333}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:21px;color:var(--dk)}
nav a{font-size:12px;font-weight:700;color:#555;text-decoration:none;margin-left:14px;cursor:pointer}nav a:hover{color:var(--tl)}
.hero{background:linear-gradient(135deg,var(--dk),var(--tl));color:#fff;text-align:center;padding:44px 16px}.hero h1{margin:0 0 6px;font-weight:700;font-size:30px}
section{padding:34px 16px}section:nth-of-type(even){background:var(--bg)}section>div{max-width:1100px;margin:auto}
h2{text-align:center;color:var(--bl);font-weight:700;font-size:24px;margin:0 0 18px}
.tx{text-align:center;max-width:820px;margin:auto;line-height:1.7}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}.gal figure{margin:0;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0002}.gal img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}.gal figcaption{font-size:12px;padding:8px}
.btn{display:inline-block;background:var(--tl);color:#fff;border:0;border-radius:6px;padding:8px 13px;font:700 12px Montserrat,Arial;text-decoration:none;cursor:pointer;margin:3px 3px 3px 0}.btn.red{background:var(--rd)}.btn.gr{background:#777}.btn.sm{padding:5px 9px;font-size:11px}
input,select,textarea{font:13px Montserrat,Arial;padding:8px;border:1px solid #bbb;border-radius:6px;margin:3px 0;max-width:100%;width:100%}
.add{background:#fff;border:1px dashed #9bb;border-radius:10px;padding:12px;margin:14px auto 0;max-width:560px}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{background:var(--dk);color:#fff;text-align:left}th,td{padding:8px;border-bottom:1px solid #e3e3e3;vertical-align:top}td.r{text-align:right}.sc{overflow-x:auto;border-radius:8px}
footer{background:var(--dk);color:#cde;text-align:center;font-size:12px;padding:18px}
/* aplikasi */
#app{display:none;min-height:100vh;background:#f3f6f8}
aside{width:236px;flex:none;background:var(--dk);color:#dbe8f5;padding:16px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.bn{font-weight:800;font-size:16px;color:#fff;padding:4px 8px 14px;line-height:1.3}.bn small{display:block;font-weight:400;font-size:11px;color:#9fc0e0;margin-top:4px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px}aside button:hover{background:#ffffff18}aside button.on{background:#fff;color:var(--dk)}aside button:focus-visible,.btn:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
aside hr{border:0;border-top:1px solid #ffffff2a;width:100%;margin:8px 0}
main{flex:1;padding:24px;min-width:0;max-width:1000px}main h1{margin:0 0 16px;font-size:22px;color:var(--dk)}main h3{color:var(--dk);margin:22px 0 8px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.k{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0001}.k small{color:#667}.k b{display:block;font-size:19px;margin-top:4px;color:var(--dk)}.k.g b{color:#15803d}.k.m b{color:var(--rd)}
.pnl{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 6px #0001;margin-bottom:12px}.pnl p{margin:4px 0 0;line-height:1.6;white-space:pre-wrap}
.bars{display:flex;gap:14px;align-items:flex-end;height:130px;padding-top:8px}.bars div{flex:1;text-align:center;font-size:11px;color:#667;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:inline-block;width:42%;min-height:2px;background:var(--tl);border-radius:3px 3px 0 0}.bars i+i{background:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row select,.row input{width:auto}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e7f6e7;color:#15803d}.tag.n{background:#fdeaea;color:var(--rd)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}#md>div{background:#fff;border-radius:12px;padding:22px;width:min(400px,92vw);max-height:90vh;overflow:auto}#md h3{margin:0 0 10px;color:var(--dk)}#md label{font-size:12px;font-weight:600;display:block;margin-top:8px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:99}
@media(max-width:760px){#app{flex-direction:column!important}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center}.bn{display:none}aside button{white-space:nowrap}aside hr{display:none}main{padding:14px}}
</style></head><body>
<div id="pubw"><header><div class="nav"><div class="brand" id="brand">Portal Warga</div><nav id="nv"></nav></div></header>
<div class="hero"><h1 id="hn">Portal Warga</h1><div>Informasi dan layanan warga</div></div><div id="pub"></div>
<footer id="ft"></footer></div>
<div id="app"></div><div id="msg"></div><div id="md"><div id="mb"></div></div>
<script>
const $=i=>document.getElementById(i),enc=new TextEncoder(),dec=new TextDecoder();
const ROLES={admin:'Administrator',bendahara:'Bendahara',warga:'Warga'};
const SEC=[['tentang','Tentang Kami'],['tata','Tata Kelola'],['media','Ruang Media'],['produk','Produk & Kemitraan'],['lapor','Pelaporan'],['kontak','Kontak Kami']];
const MN=[['home','Beranda','*'],['umum','Pengumuman','*'],['keu','Keuangan','*'],['warga','Data warga & iuran','f'],['link','CCTV & Sheet','*'],['log','Riwayat','f'],['web','Kelola website','a'],['user','Pengguna','a'],['set','Pengaturan','a']];
const KAT=['Iuran','Keamanan','Kebersihan','Perbaikan','Kegiatan','Lain-lain'];
let V=null,P={},S=null,D=null,tab='home',site=false,fb='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u)?u:'#',rp=n=>'Rp '+new Intl.NumberFormat('id-ID').format(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const adm=()=>S&&S.role==='admin',fin=()=>S&&S.role!=='warga',can=f=>f==='*'||(f==='a'&&adm())||(f==='f'&&fin());
const bln=()=>new Date().toISOString().slice(0,7),bl=k=>new Date(k+'-15').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',3500)}
const b64e=u=>{let s='';for(const b of u)s+=String.fromCharCode(b);return btoa(s)},b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64s=s=>btoa(unescape(encodeURIComponent(s)));
const im=r=>crypto.subtle.importKey('raw',b64d(r),'AES-GCM',true,['encrypt','decrypt']),rnd=()=>b64e(crypto.getRandomValues(new Uint8Array(32)));
async function kek(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64e(iv),ct:b64e(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(o)))))}}
async function unseal(k,o){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.ct))))}
async function mkUser(u,role,pw,kRaw,ktRaw){const salt=crypto.getRandomValues(new Uint8Array(16));V.users[u]={role,salt:b64e(salt),...await seal(await kek(pw,salt),{k:kRaw,kt:role==='warga'?null:ktRaw})}}
async function ghPut(path,content,m){const br=V.branch||'main',H={Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json'},u=`https://api.github.com/repos/${V.repo}/contents/${path}`;
 const g=await fetch(u+'?ref='+br,{headers:H});const sha=g.ok?(await g.json()).sha:undefined;
 const r=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:m,content,branch:br,sha})});if(!r.ok)throw new Error((await r.json()).message||r.status)}
async function saveVault(){try{if(!fin())throw new Error('Peran Warga hanya bisa melihat');V.data=await seal(S.K,D);await ghPut('data/vault.json',b64s(JSON.stringify(V)),'Update data');render();msg('Tersimpan');return true}catch(e){msg('Gagal simpan: '+e.message);return false}}
async function savePub(){try{await ghPut('data/public.json',b64s(JSON.stringify(P,null,2)),'Update konten');render();msg('Tersimpan')}catch(e){msg('Gagal simpan: '+e.message)}}
async function init(){try{P=await (await fetch('data/public.json?'+Date.now())).json()}catch(e){P={}}
 try{const r=await fetch('data/vault.json?'+Date.now());V=r.ok?await r.json():null}catch(e){V=null}render()}
function hist(a,d){D.keuangan.history.push({w:new Date().toLocaleString('id-ID'),o:ROLES[S.role]+' ('+S.user+')',a,d})}
function modal(h){$('mb').innerHTML=h;$('md').style.display='flex'}window.closeM=()=>$('md').style.display='none';
function fm(t,fs,ok,v={},btn='Simpan'){modal(`<h3>${t}</h3>`+fs.map(([id,l,ty,o])=>`<label for="f_${id}">${l}</label>`+(ty==='select'?`<select id="f_${id}">${o.map(x=>`<option ${v[id]==x?'selected':''}>${x}</option>`).join('')}</select>`:ty==='area'?`<textarea id="f_${id}" rows="5">${esc(v[id])}</textarea>`:`<input id="f_${id}" type="${ty}" value="${esc(v[id]??'')}">`)).join('')+`<div style="margin-top:12px"><button class="btn" id="fok">${btn}</button><button class="btn gr" onclick="closeM()">Batal</button></div>`);
 $('fok').onclick=async()=>{const r={};fs.forEach(f=>r[f[0]]=$('f_'+f[0]).value.trim());if(await ok(r)!==false)closeM()}}
/* ===== halaman publik ===== */
function render(){const nm=P.nama||'Portal Warga',inApp=S&&!site;document.title=nm;$('hn').textContent=nm;$('brand').textContent=nm;$('ft').textContent='© '+nm;
 $('pubw').style.display=inApp?'none':'';$('app').style.display=inApp?'flex':'none';
 $('nv').innerHTML=SEC.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('')+(S?`<a onclick="site=false;tab='home';render();scrollTo(0,0)">Buka aplikasi</a><a onclick="logout()">Keluar</a>`:`<a onclick="loginUI()">Masuk</a>`);
 $('pub').innerHTML=SEC.map(([k,a])=>{const x=P[k]||{};return`<section id="${k}"><div><h2>${a}</h2><p class="tx">${esc(x.teks).replace(/\n/g,'<br>')}</p>${k==='media'?`<div class="gal">${(x.gambar||[]).map(g=>`<figure><img loading="lazy" src="${esc(g.src)}" alt="${esc(g.cap)}" onclick="window.open(this.src)"><figcaption>${esc(g.cap)}</figcaption></figure>`).join('')}</div>`:''}${k==='lapor'?laporForm():''}</div></section>`}).join('');
 if(inApp)$('app').innerHTML=appHTML()}
function laporForm(){return`<div class="add"><input id="rn" placeholder="Nama pelapor"><input id="rb" placeholder="Blok / nomor rumah"><select id="rk"><option>Fasilitas umum</option><option>Keamanan</option><option>Kebersihan</option><option>Lainnya</option></select><textarea id="rt" rows="4" placeholder="Uraian laporan"></textarea><button class="btn" onclick="kirimLap()">Kirim lewat WhatsApp</button><div style="font-size:11px;color:#777">Laporan terkirim setelah Anda menekan kirim di WhatsApp.</div></div>`}
window.kirimLap=()=>{if(!P.wa)return msg('Nomor WhatsApp belum diatur');if(!$('rn').value||!$('rt').value)return msg('Isi nama dan uraian laporan');const d=new Date(),no='LP-'+d.toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(100+Math.random()*900);window.open('https://wa.me/'+P.wa+'?text='+encodeURIComponent(`*LAPORAN WARGA*\nNo: ${no}\nTanggal: ${d.toLocaleDateString('id-ID')}\nNama: ${$('rn').value}\nBlok/Rumah: ${$('rb').value||'-'}\nKategori: ${$('rk').value}\n\n${$('rt').value}`),'_blank')};
/* ===== kerangka aplikasi ===== */
function appHTML(){if(V.init&&tab!=='set')tab='set';const m=MN.filter(x=>can(x[2]));const cur=m.find(x=>x[0]===tab)||m[0];tab=cur[0];
 const v={home,umum,keu,warga,link,log,web,user,set:setH}[tab]();
 return`<aside><div class="bn">${esc(P.nama||'Portal Warga')}<small>${ROLES[S.role]} · ${esc(S.user)}</small></div>${m.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="tab='${x[0]}';render();scrollTo(0,0)">${x[1]}</button>`).join('')}<hr><button onclick="site=true;render();scrollTo(0,0)">Lihat situs publik</button><button onclick="logout()">Keluar</button></aside><main><h1>${cur[1]}</h1>${v}</main>`}
function sums(){const E=D.keuangan.entries,m=E.filter(e=>e.jenis==='Masuk').reduce((a,e)=>a+e.jumlah,0),k=E.filter(e=>e.jenis==='Keluar').reduce((a,e)=>a+e.jumlah,0);return{m,k,s:m-k}}
function home(){const{m,k,s}=sums(),E=D.keuangan.entries,now=new Date(),ks=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,15);ks.push(d.toISOString().slice(0,7))}
 const t=(key,j)=>E.filter(e=>e.tanggal.slice(0,7)===key&&e.jenis===j).reduce((a,e)=>a+e.jumlah,0),mx=Math.max(1,...ks.map(x=>Math.max(t(x,'Masuk'),t(x,'Keluar'))));
 const W=D.warga,bk=bln(),lun=W.filter(w=>w.lunas&&w.lunas[bk]).length;
 return`<div class="cards"><div class="k g"><small>Pemasukan</small><b>${rp(m)}</b></div><div class="k m"><small>Pengeluaran</small><b>${rp(k)}</b></div><div class="k"><small>Saldo kas</small><b>${rp(s)}</b></div>${fin()?`<div class="k"><small>Iuran ${bl(bk)}</small><b>${lun} dari ${W.length} lunas</b></div>`:''}</div>
 <h3>Arus kas 6 bulan terakhir</h3><div class="pnl"><div class="bars">${ks.map(x=>`<div><span><i style="height:${t(x,'Masuk')/mx*90}px" title="Masuk"></i><i style="height:${t(x,'Keluar')/mx*90}px" title="Keluar"></i></span>${x.slice(5)}/${x.slice(2,4)}</div>`).join('')}</div><small style="color:#667">Hijau-biru: pemasukan, merah: pengeluaran</small></div>
 <h3>Pengumuman terbaru</h3>${annList(3)}`}
function annList(n){const A=[...D.pengumuman].reverse().slice(0,n);return A.map(a=>`<div class="pnl"><b>${esc(a.judul)}</b> <small style="color:#667">${esc(a.tgl)} · ${esc(a.oleh)}</small><p>${esc(a.isi)}</p>${adm()&&n>9?`<button class="btn red sm" onclick="delAnn('${a.id}')">Hapus</button>`:''}</div>`).join('')||'<p style="color:#888">Belum ada pengumuman.</p>'}
function umum(){return(adm()?`<button class="btn" onclick="addAnn()">Buat pengumuman</button>`:'')+annList(99)}
window.addAnn=()=>fm('Pengumuman baru',[['judul','Judul','text'],['isi','Isi','area']],async r=>{if(!r.judul||!r.isi){msg('Isi judul dan isi');return false}D.pengumuman.push({id:uid(),judul:r.judul,isi:r.isi,tgl:new Date().toLocaleDateString('id-ID'),oleh:S.user});hist('Pengumuman',r.judul);await saveVault()},{},'Terbitkan');
window.delAnn=async i=>{if(confirm('Hapus pengumuman?')){D.pengumuman=D.pengumuman.filter(x=>x.id!==i);hist('Hapus pengumuman',i);await saveVault()}};
/* ===== keuangan ===== */
function keu(){const E=D.keuangan.entries,ms=[...new Set(E.map(e=>e.tanggal.slice(0,7)))].sort().reverse(),L=E.filter(e=>!fb||e.tanggal.startsWith(fb)).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)),{m,k,s}=sums();
 return`<div class="cards"><div class="k g"><small>Pemasukan</small><b>${rp(m)}</b></div><div class="k m"><small>Pengeluaran</small><b>${rp(k)}</b></div><div class="k"><small>Saldo</small><b>${rp(s)}</b></div></div>
 <div class="row" style="margin-top:14px"><select onchange="fb=this.value;render()"><option value="">Semua bulan</option>${ms.map(x=>`<option value="${x}" ${fb===x?'selected':''}>${bl(x)}</option>`).join('')}</select>${fin()?`<button class="btn" onclick="fKeu()">Tambah transaksi</button>`:'<small style="color:#777">Anda hanya dapat melihat data keuangan.</small>'}<button class="btn gr" onclick="csv()">Unduh CSV</button></div>
 <div class="sc"><table><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jenis</th><th>Jumlah</th>${fin()?'<th></th>':''}</tr>${L.map(e=>`<tr><td>${esc(e.tanggal)}</td><td>${esc(e.ket)}</td><td>${esc(e.kat||'-')}</td><td>${e.jenis}</td><td class="r">${rp(e.jumlah)}</td>${fin()?`<td style="white-space:nowrap"><button class="btn sm" onclick="fKeu('${e.id}')">Ubah</button><button class="btn red sm" onclick="hpKeu('${e.id}')">Hapus</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</table></div>`}
window.fKeu=id=>{const e=id?D.keuangan.entries.find(x=>x.id===id):{tanggal:new Date().toISOString().slice(0,10)};fm(id?'Ubah transaksi':'Transaksi baru',[['tanggal','Tanggal','date'],['ket','Keterangan','text'],['kat','Kategori','select',KAT],['jenis','Jenis','select',['Masuk','Keluar']],['jumlah','Jumlah (Rp)','number']],async r=>{const j=+r.jumlah;if(!r.ket||!(j>0)){msg('Isi keterangan dan jumlah');return false}
 if(id){hist('Ubah',`${e.ket} ${rp(e.jumlah)} → ${r.ket} ${rp(j)}`);Object.assign(e,{tanggal:r.tanggal,ket:r.ket,kat:r.kat,jenis:r.jenis,jumlah:j})}else{const n={id:uid(),tanggal:r.tanggal||e.tanggal,ket:r.ket,kat:r.kat,jenis:r.jenis,jumlah:j};D.keuangan.entries.push(n);hist('Tambah',`${n.jenis} ${rp(j)}: ${n.ket}`)}await saveVault()},e)};
window.hpKeu=async i=>{const e=D.keuangan.entries.find(x=>x.id===i);if(!confirm('Hapus transaksi ini?'))return;hist('Hapus',`${e.jenis} ${rp(e.jumlah)}: ${e.ket}`);D.keuangan.entries=D.keuangan.entries.filter(x=>x.id!==i);await saveVault()};
window.csv=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['Tanggal','Keterangan','Kategori','Jenis','Jumlah'],...D.keuangan.entries.filter(e=>!fb||e.tanggal.startsWith(fb)).map(e=>[e.tanggal,e.ket,e.kat||'',e.jenis,e.jumlah])].map(x=>x.map(q).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r],{type:'text/csv'}));a.download='keuangan.csv';a.click()};
function log(){return`<div class="sc"><table><tr><th>Waktu</th><th>Oleh</th><th>Aksi</th><th>Detail</th></tr>${[...D.keuangan.history].reverse().slice(0,200).map(h=>`<tr><td>${esc(h.w)}</td><td>${esc(h.o)}</td><td>${esc(h.a)}</td><td>${esc(h.d)}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada riwayat.</td></tr>'}</table></div><p style="font-size:12px;color:#777">Riwayat tidak bisa dihapus lewat aplikasi.</p>`}
/* ===== data warga & iuran ===== */
function warga(){const bk=bln();return`<div class="row">${adm()?`<button class="btn" onclick="fWarga()">Tambah warga</button>`:''}<small style="color:#667">Status iuran ${bl(bk)}. Menandai lunas otomatis mencatat pemasukan.</small></div><div class="sc"><table><tr><th>Nama</th><th>Blok/rumah</th><th>Telepon</th><th>Iuran/bln</th><th>Status</th><th></th></tr>${D.warga.map(w=>{const l=w.lunas&&w.lunas[bk];return`<tr><td>${esc(w.nama)}</td><td>${esc(w.blok)}</td><td>${esc(w.hp)}</td><td class="r">${rp(w.iuran||0)}</td><td><span class="tag ${l?'':'n'}">${l?'Lunas':'Belum'}</span></td><td style="white-space:nowrap"><button class="btn sm" onclick="togLunas('${w.id}')">${l?'Batalkan':'Tandai lunas'}</button>${adm()?`<button class="btn sm gr" onclick="fWarga('${w.id}')">Ubah</button><button class="btn red sm" onclick="hpWarga('${w.id}')">Hapus</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6">Belum ada data warga.</td></tr>'}</table></div>`}
window.fWarga=id=>{const w=id?D.warga.find(x=>x.id===id):{iuran:50000};fm(id?'Ubah warga':'Warga baru',[['nama','Nama','text'],['blok','Blok / nomor rumah','text'],['hp','Telepon','tel'],['iuran','Iuran per bulan (Rp)','number']],async r=>{if(!r.nama){msg('Isi nama');return false}r.iuran=+r.iuran||0;if(id)Object.assign(w,r);else D.warga.push({id:uid(),lunas:{},...r});hist(id?'Ubah warga':'Tambah warga',r.nama);await saveVault()},w)};
window.hpWarga=async i=>{const w=D.warga.find(x=>x.id===i);if(!confirm('Hapus '+w.nama+'?'))return;D.warga=D.warga.filter(x=>x.id!==i);hist('Hapus warga',w.nama);await saveVault()};
window.togLunas=async i=>{const w=D.warga.find(x=>x.id===i),bk=bln(),ref=i+':'+bk;w.lunas=w.lunas||{};if(w.lunas[bk]){delete w.lunas[bk];D.keuangan.entries=D.keuangan.entries.filter(e=>e.ref!==ref);hist('Batal lunas',`${w.nama} ${bl(bk)}`)}else{w.lunas[bk]=1;D.keuangan.entries.push({id:uid(),ref,tanggal:new Date().toISOString().slice(0,10),ket:`Iuran ${w.nama} (${w.blok||'-'}) ${bl(bk)}`,kat:'Iuran',jenis:'Masuk',jumlah:w.iuran||0});hist('Lunas',`${w.nama} ${bl(bk)} ${rp(w.iuran||0)}`)}await saveVault()};
/* ===== link ===== */
function link(){const g=j=>D.links.filter(x=>x.jenis===j).map(x=>`<div class="pnl"><b>${esc(x.nama)}</b><br><a class="btn sm" target="_blank" rel="noopener" href="${esc(safe(x.url))}">Buka</a>${adm()?`<button class="btn red sm" onclick="delLink('${x.id}')">Hapus</button>`:''}</div>`).join('')||'<p style="color:#888">Belum ada.</p>';
 return`${adm()?`<button class="btn" onclick="addLink()">Tambah link</button>`:''}<h3>CCTV</h3><div class="cards">${g('CCTV')}</div><h3>Google Sheet</h3><div class="cards">${g('Sheet')}</div>`}
window.addLink=()=>fm('Tambah link',[['jenis','Jenis','select',['CCTV','Sheet']],['nama','Nama','text'],['url','Alamat (https://…)','text']],async r=>{if(!r.nama||!/^https?:\/\//i.test(r.url)){msg('Isi nama dan alamat yang diawali https://');return false}D.links.push({id:uid(),...r});hist('Tambah link',r.nama);await saveVault()});
window.delLink=async i=>{if(confirm('Hapus link?')){D.links=D.links.filter(x=>x.id!==i);hist('Hapus link',i);await saveVault()}};
/* ===== kelola website ===== */
function web(){const gb=(P.media&&P.media.gambar)||[];return`<div class="pnl"><b>Identitas</b><p>Nama: ${esc(P.nama)}<br>WhatsApp pelaporan: ${esc(P.wa||'belum diatur')}</p><button class="btn sm" onclick="fId()">Ubah</button></div>
 <h3>Teks halaman publik</h3>${SEC.map(([k,a])=>`<div class="pnl"><b>${a}</b><p>${esc((P[k]||{}).teks)}</p><button class="btn sm" onclick="fTeks('${k}')">Ubah teks</button></div>`).join('')}
 <h3>Foto Ruang Media</h3><div class="pnl"><input id="mf" type="file" accept="image/*" multiple><input id="mc" placeholder="Keterangan foto"><button class="btn" onclick="upImg()">Unggah foto</button></div><div class="gal">${gb.map((g,i)=>`<figure><img src="${esc(g.src)}" alt=""><figcaption>${esc(g.cap)} <a href="#" style="color:var(--rd)" onclick="delImg(${i});return false">hapus</a></figcaption></figure>`).join('')}</div>`}
window.fId=()=>fm('Identitas',[['nama','Nama perumahan','text'],['wa','Nomor WhatsApp (628xxxxxxxxxx)','tel']],async r=>{let w=r.wa.replace(/\D/g,'');if(w[0]==='0')w='62'+w.slice(1);P.nama=r.nama||P.nama;P.wa=w;await savePub()},{nama:P.nama,wa:P.wa});
window.fTeks=k=>fm('Ubah teks',[['teks','Isi teks','area']],async r=>{P[k]=P[k]||{};P[k].teks=r.teks;await savePub()},P[k]||{});
window.delImg=async i=>{if(confirm('Hapus foto?')){P.media.gambar.splice(i,1);await savePub()}};
function rs(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82).split(',')[1])};i.src=URL.createObjectURL(f)})}
window.upImg=async()=>{const fs=$('mf').files;if(!fs.length)return msg('Pilih foto');msg('Mengunggah…');P.media=P.media||{};P.media.gambar=P.media.gambar||[];const cap=$('mc').value;
 try{for(const f of fs){const p='images/'+uid()+'.jpg';await ghPut(p,await rs(f),'Foto');P.media.gambar.push({src:p,cap})}}catch(e){return msg('Gagal unggah: '+e.message)}await savePub()};
/* ===== pengguna & pengaturan ===== */
function user(){return`<button class="btn" onclick="fUser()">Tambah / reset pengguna</button><div class="sc" style="margin-top:10px"><table><tr><th>Username</th><th>Peran</th><th></th></tr>${Object.entries(V.users).map(([u,x])=>`<tr><td>${esc(u)}</td><td>${ROLES[x.role]}</td><td>${u===S.user?'(Anda)':`<button class="btn red sm" onclick="delUser('${esc(u)}')">Hapus</button>`}</td></tr>`).join('')}</table></div><p style="font-size:12px;color:#777">Standar: 1 Administrator, 1 Bendahara, 1 Warga. Menyimpan username yang sudah ada berarti mereset password-nya.</p>`}
window.fUser=()=>fm('Pengguna',[['u','Username (huruf kecil/angka)','text'],['r','Peran','select',Object.values(ROLES)],['p','Password (min. 10 karakter)','password']],async r=>{if(V.init){msg('Selesaikan Pengaturan dulu');return false}const u=r.u.toLowerCase(),role=Object.keys(ROLES).find(k=>ROLES[k]===r.r);if(!/^[a-z0-9._-]{3,20}$/.test(u)||r.p.length<10){msg('Username 3-20 karakter, password minimal 10');return false}
 if(V.users[u]&&V.users[u].role==='admin'&&role!=='admin'&&Object.values(V.users).filter(x=>x.role==='admin').length<2){msg('Administrator terakhir tidak bisa diturunkan');return false}await mkUser(u,role,r.p,S.kRaw,S.ktRaw);hist('Pengguna',`${u} (${ROLES[role]})`);return await saveVault()});
window.delUser=async u=>{if(!confirm('Hapus pengguna '+u+'?'))return;delete V.users[u];hist('Hapus pengguna',u);await saveVault()};
function setH(){return`<div class="pnl" style="max-width:560px"><b>Penyimpanan GitHub</b><br><input id="sr2" value="${esc(V.repo)}" placeholder="pemilik/nama-repo"><input id="sb2" value="${esc(V.branch)}"><input id="st2" type="password" placeholder="Token GitHub (kosongkan jika tidak diganti)">${V.init?'<br><b>Aktivasi pertama:</b> ganti password Administrator (wajib).<input id="sn" type="password" placeholder="Password Administrator baru (min. 10)">':'<br><b>Ganti password saya</b><input id="sn" type="password" placeholder="Password baru (kosongkan jika tidak diganti)">'}<button class="btn" onclick="saveSet()">Simpan</button></div>`}
window.saveSet=async()=>{V.repo=$('sr2').value.trim();V.branch=$('sb2').value.trim()||'main';const t=$('st2').value.trim(),pw=$('sn').value;
 if(V.init){if(!V.repo||!t||pw.length<10)return msg('Isi repo, token, dan password baru (min. 10 karakter)');const kRaw=rnd(),ktRaw=rnd(),kt=await im(ktRaw);S.token=t;S.kRaw=kRaw;S.ktRaw=ktRaw;S.kt=kt;S.K=await im(kRaw);V.tok=await seal(kt,{t});V.users={};await mkUser(S.user,'admin',pw,kRaw,ktRaw);delete V.init;tab='home'}
 else{if(t){S.token=t;V.tok=await seal(S.kt,{t})}if(pw){if(pw.length<10)return msg('Password minimal 10 karakter');await mkUser(S.user,'admin',pw,S.kRaw,S.ktRaw)}}
 hist('Pengaturan','Diperbarui');await saveVault()};
/* ===== masuk / keluar ===== */
window.loginUI=()=>V&&V.users?modal(`<h3>Masuk</h3><input id="lgu" placeholder="Username" autocomplete="username"><input id="lgp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">Masuk</button><button class="btn gr" onclick="closeM()">Batal</button>`):modal(`<h3>Masuk</h3><p>Data login tidak ditemukan. Pastikan folder data/ (vault.json) sudah terunggah ke GitHub.</p><button class="btn gr" onclick="closeM()">Tutup</button>`);
window.setupUI=()=>modal(`<h3>Pengaturan awal</h3><p style="font-size:12px;color:#666">Buat penyimpanan terenkripsi di GitHub.</p><input id="sr" placeholder="pemilik/nama-repo"><input id="sb" value="main"><input id="st" type="password" placeholder="Token GitHub (Contents: read/write)"><input id="su" placeholder="Username Administrator"><input id="sp" type="password" placeholder="Password Administrator (min. 10)"><button class="btn" onclick="doSetup()">Buat</button><button class="btn gr" onclick="closeM()">Batal</button>`);
window.doLogin=async()=>{const u=$('lgu').value.trim().toLowerCase(),w=V.users[u];try{if(!w)throw 0;const b=await unseal(await kek($('lgp').value,b64d(w.salt)),w),K=await im(b.k);let kt=null,token=null;if(b.kt){kt=await im(b.kt);token=(await unseal(kt,V.tok)).t}D=await unseal(K,V.data);D.links=D.links||[];D.pengumuman=D.pengumuman||[];D.warga=D.warga||[];D.keuangan=D.keuangan||{entries:[],history:[]};S={user:u,role:w.role,token,kRaw:b.k,ktRaw:b.kt,kt,K};tab=V.init?'set':'home';site=false;closeM();render();scrollTo(0,0)}catch(e){msg('Username atau password salah')}};
window.doSetup=async()=>{const u=$('su').value.trim().toLowerCase(),p=$('sp').value,t=$('st').value.trim(),r=$('sr').value.trim();if(!/^[a-z0-9._-]{3,20}$/.test(u)||p.length<10)return msg('Username 3-20 karakter, password minimal 10');if(!t||!r)return msg('Repo dan token wajib');
 try{const kRaw=rnd(),ktRaw=rnd(),kt=await im(ktRaw);V={repo:r,branch:$('sb').value.trim()||'main',users:{},tok:await seal(kt,{t}),data:null};await mkUser(u,'admin',p,kRaw,ktRaw);D={links:[],pengumuman:[],warga:[],keuangan:{entries:[],history:[]}};S={user:u,role:'admin',token:t,kRaw,ktRaw,kt,K:await im(kRaw)};tab='home';site=false;closeM();await saveVault()}catch(e){V=null;S=null;msg('Gagal: '+e.message)}};
window.logout=()=>{S=null;D=null;site=false;render();scrollTo(0,0)};
init().then(()=>{if(location.hash==='#setup'&&(!V||!V.users))setupUI()});
</script></body></html>
